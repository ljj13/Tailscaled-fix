name: Verified arm64 Release

on:
  push:
    tags: ['v1.102.5-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      asset: ${{ steps.metadata.outputs.asset }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Validate metadata and source
        id: metadata
        env:
          EVENT: ${{ github.event_name }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, pathlib
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('release_ci', 'scripts/release-ci.py')
          tool = importlib.util.module_from_spec(spec); spec.loader.exec_module(tool)
          fields = dict(line.split('=', 1) for line in pathlib.Path('module.prop').read_text().splitlines() if '=' in line)
          tag = os.environ['TAG_REF'] if os.environ['EVENT'] == 'push' else fields['version']
          meta = tool.metadata(root, tag)
          tool.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"tag={tag}\nasset={meta['asset']}\n")
          tool.prepare(root, tag, untagged=os.environ['EVENT'] != 'push')
          PY
      - name: Install locked browser test tools
        run: |
          mkdir -p build/browser-tools
          cp tests/browser-tools/package*.json build/browser-tools/
          npm ci --prefix build/browser-tools --ignore-scripts --no-audit --no-fund
          build/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Complete tests before packaging
        run: python3 scripts/release-ci.py test
      - name: Build and verify canonical release bundle
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: python3 scripts/release-ci.py build --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-arm64-bundle
          path: |
            dist/${{ steps.metadata.outputs.asset }}
            dist/${{ steps.metadata.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    # workflow_dispatch is validation-only, even when dispatched at a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-arm64-bundle
          path: dist
      - name: Verify local bundle, stage draft, verify assets, publish, update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: python3 scripts/release-ci.py publish --tag "$RELEASE_TAG"
