name: Build Android DNS fix

on:
  workflow_dispatch:
  push:
    branches: ['fix/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Script and upgrade tests
        run: |
          python3 -m unittest discover -s tests -p 'test_dns_build.py' -v
          python3 tests/test_shell.py
          python3 tests/test_dns_helper.py
          python3 tests/test_android_hostname.py
          shellcheck -s sh -S warning -e SC1090,SC1091,SC2034,SC2086,SC2154 customize.sh service.sh uninstall.sh tailscale/scripts/* system/bin/* scripts/build.sh
      - name: Build pinned v1.102.5 and package
        run: sh scripts/build.sh
      - name: Go resolver reload integration
        run: python3 tests/test_resolver.py
      - uses: actions/upload-artifact@v4
        with:
          name: tailscaled-v1.102.5-dnsfix.2-arm64
          path: dist/*
          if-no-files-found: error
